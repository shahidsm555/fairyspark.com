<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3ECF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9A9C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C7B2E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9A9C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#6B2230" stroke-width="3"/>
  
  <!-- Magic wand (fairy element) -->
  <g transform="translate(60, 40)">
    <line x1="0" y1="0" x2="35" y2="35" stroke="#6B2230" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#E9A9C0" stroke="#6B2230" stroke-width="2"/>
    <!-- Star at wand tip -->
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="url(#sparkGradient)" stroke="#6B2230" stroke-width="1"/>
  </g>
  
  <!-- Sparkles -->
  <text x="130" y="50" font-family="Arial" font-size="24" fill="#C7B2E3">✦</text>
  <text x="150" y="70" font-family="Arial" font-size="18" fill="#E9A9C0">✦</text>
  <text x="45" y="120" font-family="Arial" font-size="20" fill="#C7B2E3">✦</text>
  <text x="155" y="140" font-family="Arial" font-size="16" fill="#E9A9C0">✦</text>
  
  <!-- Lip gloss tube -->
  <g transform="translate(100, 110)">
    <rect x="-8" y="0" width="16" height="40" rx="2" fill="#6B2230"/>
    <rect x="-6" y="-15" width="12" height="18" rx="3" fill="#E9A9C0" stroke="#6B2230" stroke-width="1"/>
    <ellipse cx="0" cy="-15" rx="6" ry="3" fill="#C7B2E3"/>
  </g>
  
  <!-- Text: Fairy Spark -->
  <text x="100" y="175" font-family="'Fredoka', 'Arial Rounded', sans-serif" font-size="22" font-weight="600" fill="#6B2230" text-anchor="middle">Fairy Spark</text>
</svg>