<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairy Spark – Lip Gloss, Nail Polish, Hair Ties & Mini Bags</title>
<meta name="description" content="Fairy Spark: lip glosses, nail polish, hair ties, headbands & mini bags. Order on WhatsApp, pay with JazzCash or Easypaisa.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="store-data.js"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#FFF8F1;color:#2B1B34;font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:17px;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-0.02em}

/* ===== Sticky top: logo + bag + category pills ===== */
.top{position:sticky;top:0;z-index:30;background:#FFF8F1;box-shadow:0 2px 10px rgba(43,27,52,0.06)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.top-row img{width:38px;height:38px;flex:none}
.top-row .brand{flex:1;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;color:#2B1B34;display:flex;align-items:center;gap:5px}
.top-row .brand .spark{color:#E8356A}
.btn-bag{position:relative;height:46px;padding:0 16px;border:none;background:#2B1B34;color:#FFFFFF;border-radius:14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.badge{min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#FFE27A;color:#2B1B34;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cats{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;white-space:nowrap;border:2px solid #2B1B34;background:#FFFFFF;color:#2B1B34;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px}
.cats button.active{background:#2B1B34;color:#FFFFFF}

/* ===== Hero banner ===== */
.hero{margin:14px 12px;background:#D42A5B;color:#FFFFFF;border-radius:24px;padding:22px 20px;text-align:center}
.hero h1{margin:0 0 6px;font-size:clamp(26px,7vw,36px);line-height:1.05}
.hero p{margin:0;font-size:15px;opacity:0.95}

/* ===== Category sections ===== */
main{max-width:720px;margin:0 auto;padding:0 12px}
.section{margin-top:30px;scroll-margin-top:150px}
.section h2{margin:0 0 4px;font-size:24px}
.section .note{margin:0 0 14px;font-size:14px;color:#5E4C66;line-height:1.4}

/* ===== Product grid & cards ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:480px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#FFFFFF;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(43,27,52,0.05)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#F4E8DC;display:block}
.card .pname{font-weight:700;font-size:14.5px;line-height:1.3;color:#2B1B34}
.card .pshade{display:flex;align-items:center;gap:6px;font-size:13px;color:#5E4C66}
.card .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(43,27,52,0.15);flex:none}
.card .deal{align-self:flex-start;background:#FFE27A;color:#2B1B34;font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:999px}
.card .bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.card .price{font-weight:800;font-size:16px;color:#2B1B34}
.stepper{display:flex;align-items:center;gap:6px;background:#F4E8DC;border-radius:12px;padding:3px}
.stepper button{width:34px;height:34px;border:none;border-radius:9px;font-size:19px;font-weight:700;background:transparent;color:#2B1B34;display:flex;align-items:center;justify-content:center}
.stepper .num{min-width:22px;text-align:center;font-weight:800;font-size:15px}
.btn-add-solo{width:44px;height:44px;border:none;border-radius:12px;background:#2B1B34;color:#FFFFFF;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn-add-solo:active{transform:scale(0.94)}
.card.in-cart{outline:2px solid #1E9E5A}

/* ===== Steps section ===== */
.steps{display:flex;flex-direction:column;gap:10px;margin-top:34px}
.step-card{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:4px}
.step-card b{font-size:16px}
.step-card span{font-size:14.5px;line-height:1.4}
.step-1{background:#C9F0DD}
.step-2{background:#FFE27A}
.step-3{background:#D9CCFF}

.footer-note{text-align:center;color:#7A6A80;font-size:13px;padding:30px 20px 10px;line-height:1.6}

/* ===== Bottom bag bar (always visible) ===== */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,248,241,0),#FFF8F1 35%)}
.bar button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:560px;margin:0 auto;height:58px;padding:0 22px;border:none;border-radius:999px;background:#D42A5B;color:#FFFFFF;font-size:16px;font-weight:800;box-shadow:0 10px 24px rgba(43,27,52,0.28)}
.bar button[disabled]{background:#C9BCC2;color:#6E5A60;box-shadow:none}

/* ===== Cart / checkout overlay ===== */
.overlay-bg{position:fixed;inset:0;z-index:50;background:rgba(43,27,52,0.5);display:none}
.overlay-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;background:#FFF8F1;border-radius:26px 26px 0 0;overflow-y:auto;display:none;padding:6px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.open{display:block}
.sheet-handle{width:44px;height:5px;background:#E4D5C8;border-radius:3px;margin:10px auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.sheet-head h2{margin:0;font-size:24px}
.btn-close{width:40px;height:40px;border:none;background:#F4E8DC;border-radius:12px;font-size:20px;color:#2B1B34;font-weight:700}

.bag-empty{background:#FFFFFF;border-radius:20px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bag-empty span{font-size:17px;font-weight:700}
.btn-shop{height:48px;padding:0 24px;border:none;border-radius:999px;background:#2B1B34;color:#FFFFFF;font-weight:700;font-size:15px}

.line{display:flex;gap:10px;align-items:center;background:#FFFFFF;border-radius:18px;padding:10px;margin-bottom:10px}
.line img{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:none;background:#F4E8DC}
.line .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.line .name{font-weight:700;font-size:14.5px;line-height:1.25}
.line .shade{font-size:12.5px;color:#7A6A80}
.line .lprice{font-weight:800;font-size:14.5px;color:#2B1B34}
.line .stepper{flex:none}

.summary{background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:15px;margin-top:6px}
.summary .row{display:flex;justify-content:space-between}
.summary .disc{color:#1E7A50;font-weight:700}
.summary .total{border-top:1px solid #F0E2D6;padding-top:10px;font-weight:800;font-size:19px}

.section-lbl{font-size:15px;font-weight:800;margin:20px 0 10px}
.field{width:100%;height:50px;border:1.5px solid #EADBCD;border-radius:14px;padding:0 14px;font-size:16px;background:#FFFFFF;color:#2B1B34;margin-bottom:10px}
textarea.field{height:auto;min-height:76px;padding:12px 14px;resize:vertical}

.pay-box{background:#FFE27A;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pay-box b{font-size:15px}
.pay-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFFFFF;border-radius:14px;padding:8px 8px 8px 14px}
.pay-row .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px}
.btn-copy{height:42px;padding:0 16px;border:none;border-radius:11px;background:#2B1B34;color:#FFFFFF;font-weight:700;font-size:14px}

.btn-send{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border:none;border-radius:999px;background:#1E9E5A;color:#FFFFFF;font-weight:800;font-size:17px;text-decoration:none;margin-top:16px}
.btn-send[disabled],.btn-send.disabled{background:#C9BCC2;color:#6E5A60;pointer-events:none}
.hint{font-size:13px;color:#7A6A80;text-align:center;margin-top:8px;line-height:1.5}

.hidden{display:none !important}
</style>
</head>
<body>

<!-- ===== Sticky top bar ===== -->
<div class="top">
  <div class="top-row">
    <img src="logo.svg" alt="Fairy Spark">
    <span class="brand"><span class="spark">✦</span>Fairy Spark</span>
    <button class="btn-bag" onclick="openCart()" aria-label="Open bag">
      🛍️ <span class="badge" id="bagCount">0</span>
    </button>
  </div>
  <nav class="cats" id="catNav" aria-label="Jump to category"></nav>
</div>

<!-- ===== Hero ===== -->
<div class="hero">
  <h1>Little things that sparkle ✨</h1>
  <p>Scroll down to see everything. Tap + to add to your bag!</p>
</div>

<main id="feed"></main>

<div class="footer-note">
  Made with 💖 by Fairy Spark · Order on WhatsApp · Pay with JazzCash or Easypaisa
</div>

<!-- ===== Bottom bag bar ===== -->
<div class="bar">
  <button id="barBtn" onclick="openCart()">
    <span id="barLeft">🛍️ Your bag is empty</span>
    <span id="barRight"></span>
  </button>
</div>

<!-- ===== Cart / Checkout overlay ===== -->
<div class="overlay-bg" id="overlayBg" onclick="closeCart()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Your Bag</h2>
    <button class="btn-close" onclick="closeCart()" aria-label="Close">×</button>
  </div>
  <div id="sheetContent"></div>
</div>

<script>
// ============ DATA ============
const CATS = window.FS_CATS || [];
const WA = window.FS_WA || '923705929757';

// Flatten every item (and its variants) into simple display "cards"
// key = unique cart id, everything else is display info
function flattenCat(cat) {
  const cards = [];
  cat.items.forEach(it => {
    if (it.variants && it.variants.length) {
      it.variants.forEach(v => {
        cards.push({
          key: v.id, name: it.name, label: v.label, img: it.img,
          price: it.price, color: null, pack3: it.pack3, deal: it.deal, catId: cat.id
        });
      });
    } else {
      cards.push({
        key: it.id, name: it.name, label: it.shade || '', img: it.img,
        price: it.price, color: it.color || null, pack3: it.pack3, deal: it.deal, catId: cat.id
      });
    }
  });
  return cards;
}

const allCards = [];
const cardByKey = {};
CATS.forEach(c => {
  const cards = flattenCat(c);
  cards.forEach(card => { cardByKey[card.key] = card; allCards.push(card); });
});

// ============ STATE ============
let cart = {};
try { cart = JSON.parse(localStorage.getItem('fs-cart') || '{}'); } catch (e) {}
let form = { name: '', phone: '', address: '', city: '' };
try { Object.assign(form, JSON.parse(localStorage.getItem('fs-form') || '{}')); } catch (e) {}

const $ = id => document.getElementById(id);
const rs = n => 'Rs ' + n.toLocaleString('en-US');
const q = k => cart[k] || 0;

function setQty(key, qty) {
  qty = Math.max(0, Math.min(50, qty));
  if (qty <= 0) delete cart[key]; else cart[key] = qty;
  try { localStorage.setItem('fs-cart', JSON.stringify(cart)); } catch (e) {}
  renderAll();
}

function getTotals() {
  const lines = Object.keys(cart).filter(k => cardByKey[k]).map(k => {
    const c = cardByKey[k];
    return { key: k, ...c, qty: cart[k], lineTotal: c.price * cart[k] };
  });
  const count = lines.reduce((a, l) => a + l.qty, 0);
  const subtotal = lines.reduce((a, l) => a + l.lineTotal, 0);
  const discount = lines.filter(l => l.pack3).reduce((a, l) => a + Math.floor(l.qty / 3) * 50, 0);
  const total = subtotal - discount;
  return { lines, count, subtotal, discount, total };
}

// ============ BUILD STATIC FEED (once) ============
function buildFeed() {
  $('catNav').innerHTML = CATS.map(c =>
    `<button data-cat="${c.id}" onclick="jumpTo('${c.id}')">${c.title}</button>`
  ).join('');

  $('feed').innerHTML = CATS.map(c => {
    const cards = flattenCat(c);
    return `
      <section class="section" id="sec-${c.id}">
        <h2>${c.title}</h2>
        ${c.note ? `<p class="note">${c.note}</p>` : ''}
        <div class="grid">
          ${cards.map(cardHtml).join('')}
        </div>
      </section>
    `;
  }).join('') + `
    <div class="steps">
      <div class="step-card step-1"><b>1. Fill your bag</b><span>Tap + on anything you like. Buy 3 strawberry glosses for Rs 550.</span></div>
      <div class="step-card step-2"><b>2. Pay by JazzCash / Easypaisa</b><span>Send the total to 0370 5929757.</span></div>
      <div class="step-card step-3"><b>3. Send order on WhatsApp</b><span>We confirm delivery there.</span></div>
    </div>
  `;
}

function cardHtml(c) {
  const shadeHtml = c.color
    ? `<div class="pshade"><span class="dot" style="background:${c.color}"></span><span>${c.label}</span></div>`
    : (c.label ? `<div class="pshade">${c.label}</div>` : '');
  const dealHtml = c.deal ? `<div class="deal">${c.deal}</div>` : '';
  return `
    <div class="card" id="card-${c.key}">
      <img src="${c.img}" alt="${c.name}" loading="lazy">
      <div class="pname">${c.name}</div>
      ${shadeHtml}
      ${dealHtml}
      <div class="bottom-row">
        <span class="price">${rs(c.price)}</span>
        <div id="ctrl-${c.key}"></div>
      </div>
    </div>
  `;
}

// ============ RENDER DYNAMIC PARTS (qty controls, bag, bar) ============
function controlHtml(key) {
  const qty = q(key);
  if (qty === 0) {
    return `<button class="btn-add-solo" onclick="setQty('${key}', 1)" aria-label="Add to bag">+</button>`;
  }
  return `
    <div class="stepper">
      <button onclick="setQty('${key}', ${qty - 1})" aria-label="Decrease">−</button>
      <span class="num">${qty}</span>
      <button onclick="setQty('${key}', ${qty + 1})" aria-label="Increase">+</button>
    </div>
  `;
}

function renderControls() {
  allCards.forEach(c => {
    const el = $('ctrl-' + c.key);
    if (el) el.innerHTML = controlHtml(c.key);
    const cardEl = $('card-' + c.key);
    if (cardEl) cardEl.classList.toggle('in-cart', q(c.key) > 0);
  });
}

function renderBar() {
  const t = getTotals();
  $('bagCount').textContent = t.count;
  const barBtn = $('barBtn');
  if (t.count === 0) {
    barBtn.disabled = true;
    $('barLeft').textContent = '🛍️ Your bag is empty';
    $('barRight').textContent = '';
  } else {
    barBtn.disabled = false;
    $('barLeft').textContent = `🛍️ View bag · ${t.count} item${t.count === 1 ? '' : 's'}`;
    $('barRight').textContent = rs(t.total);
  }
}

function getWaHref() {
  const { lines, discount, total } = getTotals();
  const msg = [
    'Hi Fairy Spark, I want to order:',
    ...lines.map(l => `• ${l.name}${l.label ? ' (' + l.label + ')' : ''} x${l.qty} = ${rs(l.lineTotal)}`),
    discount ? `Pack of 3 discount: -${rs(discount)}` : null,
    `Total: ${rs(total)}`, '',
    `Name: ${form.name}`, `Phone: ${form.phone}`, `Address: ${form.address}`, `City: ${form.city}`,
    '', 'I will send the payment screenshot here.'
  ].filter(x => x !== null).join('\n');
  return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
}

function renderSheet() {
  const t = getTotals();
  if (t.lines.length === 0) {
    $('sheetContent').innerHTML = `
      <div class="bag-empty">
        <span>Your bag is empty.</span>
        <button class="btn-shop" onclick="closeCart()">Start shopping</button>
      </div>
    `;
    return;
  }

  const linesHtml = t.lines.map(l => `
    <div class="line">
      <img src="${l.img}" alt="">
      <div class="info">
        <span class="name">${l.name}</span>
        ${l.label ? `<span class="shade">${l.label}</span>` : ''}
        <span class="lprice">${rs(l.lineTotal)}</span>
      </div>
      <div class="stepper">
        <button onclick="setQty('${l.key}', ${l.qty - 1})" aria-label="Decrease">−</button>
        <span class="num">${l.qty}</span>
        <button onclick="setQty('${l.key}', ${l.qty + 1})" aria-label="Increase">+</button>
      </div>
    </div>
  `).join('');

  const discRow = t.discount > 0 ? `<div class="row disc"><span>Pack of 3 discount</span><span>− ${rs(t.discount)}</span></div>` : '';
  const formOk = form.name.trim() && form.phone.trim() && form.address.trim() && form.city.trim();

  $('sheetContent').innerHTML = `
    ${linesHtml}
    <div class="summary">
      <div class="row"><span>Subtotal</span><span>${rs(t.subtotal)}</span></div>
      ${discRow}
      <div class="row total"><span>Total</span><span>${rs(t.total)}</span></div>
    </div>

    <div class="section-lbl">Your delivery details</div>
    <input class="field" id="fName" placeholder="Full name" value="${escapeAttr(form.name)}">
    <input class="field" id="fPhone" type="tel" placeholder="Phone number" value="${escapeAttr(form.phone)}">
    <textarea class="field" id="fAddress" placeholder="Delivery address" rows="2">${escapeHtml(form.address)}</textarea>
    <input class="field" id="fCity" placeholder="City" value="${escapeAttr(form.city)}">

    <div class="pay-box">
      <b>Pay ${rs(t.total)} by JazzCash / Easypaisa</b>
      <div class="pay-row">
        <span class="num">0370 5929757</span>
        <button class="btn-copy" id="btnCopy" onclick="copyNum()">Copy</button>
      </div>
    </div>

    <a class="btn-send ${formOk ? '' : 'disabled'}" id="btnSend" href="${formOk ? getWaHref() : '#'}" target="_blank" rel="noopener">
      ${formOk ? '✅ Send order on WhatsApp' : 'Fill in your details above first'}
    </a>
    <div class="hint">Tap send, then attach your payment screenshot in WhatsApp. We'll confirm delivery there.</div>
  `;

  ['fName', 'fPhone', 'fAddress', 'fCity'].forEach(id => {
    const el = $(id);
    if (!el) return;
    el.addEventListener('input', e => {
      const key = id.slice(1).toLowerCase();
      form[key] = e.target.value;
      try { localStorage.setItem('fs-form', JSON.stringify(form)); } catch (err) {}
      const btn = $('btnSend');
      const okNow = form.name.trim() && form.phone.trim() && form.address.trim() && form.city.trim();
      if (okNow) {
        btn.classList.remove('disabled');
        btn.href = getWaHref();
        btn.textContent = '✅ Send order on WhatsApp';
      } else {
        btn.classList.add('disabled');
        btn.textContent = 'Fill in your details above first';
      }
    });
  });
}

function escapeHtml(s) { return (s || '').replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

function copyNum() {
  try { navigator.clipboard.writeText('03705929757'); } catch (e) {}
  const b = $('btnCopy');
  if (b) { b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy', 1500); }
}

function renderAll() {
  renderControls();
  renderBar();
  if ($('sheet').classList.contains('open')) renderSheet();
}

// ============ CART OVERLAY OPEN/CLOSE ============
function openCart() {
  renderSheet();
  $('overlayBg').classList.add('open');
  $('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  $('overlayBg').classList.remove('open');
  $('sheet').classList.remove('open');
  document.body.style.overflow = '';
}

// ============ CATEGORY JUMP + ACTIVE HIGHLIGHT ============
function jumpTo(catId) {
  const el = $('sec-' + catId);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setupActiveNav() {
  const sections = CATS.map(c => $('sec-' + c.id)).filter(Boolean);
  const navBtns = {};
  CATS.forEach(c => { navBtns[c.id] = document.querySelector(`.cats button[data-cat="${c.id}"]`); });
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('sec-', '');
        Object.values(navBtns).forEach(b => b && b.classList.remove('active'));
        if (navBtns[id]) {
          navBtns[id].classList.add('active');
          navBtns[id].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }
    });
  }, { rootMargin: '-160px 0px -70% 0px' });
  sections.forEach(s => obs.observe(s));
}

// ============ INIT ============
function init() {
  buildFeed();
  renderAll();
  setupActiveNav();
}

if (window.FS_CATS) {
  init();
} else {
  const iv = setInterval(() => {
    if (window.FS_CATS) { clearInterval(iv); location.reload(); }
  }, 150);
}
</script>
